name: HBL Master Super Agent Engine

on:
  # 🔥 આ લાઇન ઉમેરવાથી મેન્યુઅલ રન કરવાનું લીલું "Run workflow" બટન એક્ટિવેટ થઈ જશે
  workflow_dispatch:

  schedule:
    # દર સોમવારથી શુક્રવાર સવારે ભારતીય સમય મુજબ ૯:૦૫ થી સાંજે ૪:૦૦ સુધી દર ૧૫ મિનિટે રન થશે
    - cron: '35/15 3-10 * * 1-5'

jobs:
  run_agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pytz

      - name: Execute Super Agent
        run: python hbl_super_agent.py
