name: HBL Master Super Agent Engine

on:
  schedule:
    # આ સેટિંગ સવારે ૯:૦૫ વાગ્યાથી લઈને સાંજે ૪:૦૦ વાગ્યા સુધી દર ૧૫ મિનિટે રન કરશે
    - cron: '35/15 3-10 * * 1-5'

jobs:
  run_agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pytz

      - name: Execute Super Agent
        run: python hbl_super_agent.py
